<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗺️ Dungeon Cartographer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>🗺️ Dungeon Cartographer</h1>
            <p class="subtitle">Generate printable dungeon maps for your D&D campaign</p>
        </header>

        <div class="controls">
            <button id="generateBtn" class="btn btn-primary">🎲 Generate Dungeon</button>
            <button id="exportBtn" class="btn btn-success">📤 Export JSON</button>
            <button id="printBtn" class="btn btn-secondary">🖨️ Print Map</button>
            <button id="resetBtn" class="btn btn-danger">🔄 Reset</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">🏠 Rooms</span>
                <span class="stat-value" id="roomCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">📏 Depth</span>
                <span class="stat-value" id="depth">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">👹 Monsters</span>
                <span class="stat-value" id="monsterCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">💰 Treasure</span>
                <span class="stat-value" id="treasureCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">⚠️ Traps</span>
                <span class="stat-value" id="trapCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">👑 Bosses</span>
                <span class="stat-value" id="bossCount">0</span>
            </div>
        </div>

        <div id="dungeon-container">
            <div id="dungeon-grid"></div>
        </div>

        <div id="legend-container" class="log-container">
            <!-- Legend will be rendered by JavaScript -->
        </div>

        <div class="log-container">
            <h3>📜 Generation Log</h3>
            <div id="log"></div>
        </div>

        <footer>
            <p>Created with 🎲 for D&D | <a href="https://github.com/your-username/dungeon-cartographer" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script src="js/dungeon.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
