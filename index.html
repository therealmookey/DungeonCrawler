<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗺️ Dungeon Cartographer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <h1>🗺️ Dungeon Cartographer</h1>
        </header>

        <!-- Main Map Area -->
        <div id="map-container">
            <div id="dungeon-grid"></div>
        </div>

        <!-- Bottom Panel -->
        <div id="bottom-panel">
            <!-- Dice Info -->
            <div class="dice-info">
                <div class="dice-box">
                    <span class="dice-label">🎲 D20</span>
                    <span class="dice-value" id="d20Display">-</span>
                    <span class="dice-status" id="d20Status">Ready</span>
                </div>
                <div class="dice-box">
                    <span class="dice-label">🎲 D4</span>
                    <span class="dice-value" id="d4Display">-</span>
                    <span class="dice-status" id="d4Status">Waiting</span>
                </div>
                <div class="dice-box">
                    <span class="dice-label">📊 Charges</span>
                    <span class="dice-value" id="chargesDisplay">0</span>
                    <span class="dice-status" id="chargesStatus">Roll D20</span>
                </div>
                <div class="dice-box">
                    <span class="dice-label">🏠 Rooms</span>
                    <span class="dice-value" id="roomCount">0</span>
                    <span class="dice-status">Total</span>
                </div>
                <div class="dice-box">
                    <span class="dice-label">📍 Position</span>
                    <span class="dice-value" id="position">(0,0)</span>
                    <span class="dice-status" id="direction">-</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="controls">
                <button id="rollD20Btn" class="btn btn-primary">🎲 Roll D20</button>
                <button id="rollD4Btn" class="btn btn-secondary" disabled>🎲 Roll D4</button>
				<button id="balanceBtn" class="btn btn-info">⚖️ Balance Features</button>
                <button id="undoBtn" class="btn btn-warning">↩️ Undo</button>
                <button id="resetBtn" class="btn btn-danger">🔄 Reset</button>
                <button id="printBtn" class="btn btn-success">🖨️ Print</button>
            </div>

            <!-- Log -->
            <div class="log-container">
                <div id="log"></div>
            </div>
        </div>
    </div>

    <script src="js/dungeon.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
